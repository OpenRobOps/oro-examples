# Shared ("pretty") map for the flatland simulation — a rendered version of maps/sample_map.pgm,
# shown in the Navigation widget next to the robot's own occupancy grid. It embeds
# maps/pretty/sample_map_pretty_400x400.png (same framing as the PGM, 0.05 m/px): the 1600 px
# version is over ORO's 100 kB API request limit.
kind: SpatialAnnotation
apiVersion: v0.1
metadata:
  id: "flatland-pretty"
spec:
  scope: "system"
  type: map
  frameId: "map"
  label: "Flatland (rendered)"
  x: 0.0
  y: 0.0
  resolution: 0.05
  formatVersion: 2
  image: 
